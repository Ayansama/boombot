<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>boombot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #f0f0f0;
            min-height: 100vh;
        }

        header {
            padding: 20px 32px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        header span {
            font-size: 0.8rem;
            color: #666;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px;
        }

        /* Call button */
        .call-box {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            margin-bottom: 40px;
        }

        .call-box p {
            color: #888;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        #status {
            font-size: 0.85rem;
            margin-top: 14px;
            color: #666;
            min-height: 20px;
        }

        #status.active {
            color: #4ade80;
        }

        #status.error {
            color: #f87171;
        }

        button {
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #startBtn {
            background: #6366f1;
            color: #fff;
        }

        #endBtn {
            background: #ef4444;
            color: #fff;
            display: none;
            margin-left: 10px;
        }

        /* Call list */
        h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #aaa;
        }

        .call-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .call-item {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .call-item:hover {
            border-color: #6366f1;
        }

        .call-item .meta {
            font-size: 0.82rem;
            color: #666;
            margin-top: 4px;
        }

        .call-item .badge {
            background: #1e1e2e;
            color: #818cf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
        }

        .empty {
            color: #555;
            font-size: 0.9rem;
            text-align: center;
            padding: 40px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 28px;
            width: 90%;
            max-width: 640px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1rem;
        }

        .close-btn {
            background: #2a2a2a;
            color: #aaa;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .section-label {
            font-size: 0.75rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 18px 0 10px;
        }

        .transcript-turn {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .transcript-turn.user {
            background: #1e1e2e;
            border-left: 3px solid #6366f1;
        }

        .transcript-turn.bot {
            background: #1a1f1a;
            border-left: 3px solid #4ade80;
        }

        .turn-role {
            font-size: 0.72rem;
            color: #666;
            margin-bottom: 4px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .metric-box {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .metric-box .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: #818cf8;
        }

        .metric-box .lbl {
            font-size: 0.72rem;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>boombot</h1>
        <span>Mini Call Log Service</span>
    </header>

    <div class="container">

        <!-- Call controls -->
        <div class="call-box">
            <p>Click to start a voice call with the AI agent.</p>
            <button id="startBtn" onclick="startCall()">Start Call</button>
            <button id="endBtn" onclick="endCall()">End Call</button>
            <div id="status">Idle</div>
        </div>

        <!-- Call list -->
        <h2>Recent Calls</h2>
        <div class="call-list" id="callList">
            <div class="empty">No calls yet.</div>
        </div>

    </div>

    <!-- Detail modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Call Detail</h3>
                <button class="close-btn" onclick="closeModal()">Close</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script src="app.js"></script>

</body>

</html>
